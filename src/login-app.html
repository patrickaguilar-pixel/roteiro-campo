<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar – Roteiro de Campo</title><link rel="icon" href="favicon.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0B6B45,#06402e);font-family:system-ui,-apple-system,Roboto,sans-serif;padding:20px;box-sizing:border-box}
.c{background:#fff;border-radius:18px;max-width:360px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-size:22px;margin:10px 0 4px;color:#17231F}p{color:#5E6B66;font-size:15px;line-height:1.45}
.b{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:1px solid #D5DDD9;background:#fff;font:600 16px system-ui;color:#17231F;text-decoration:none;margin-top:10px;cursor:pointer}
.b.v{background:#0B6B45;border-color:#0B6B45;color:#fff}.e{color:#B3261E}
</style></head><body><div class="c">
<img src="icon-192.png" width="64" height="64" alt=""><h1>Roteiro de Campo</h1>
<div id="m"><p>Entre com a sua conta Google para usar o aplicativo.</p><button class="b" id="g">Entrar com Google</button></div>
<p class="e" id="e"></p></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp(window.RC_FIREBASE);
const auth = firebase.auth(), prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
const m = document.getElementById('m'), err = document.getElementById('e');
function pronto(r){
  const tk = r && r.credential && r.credential.idToken; if (!tk){ err.textContent = 'Não foi possível obter o login. Tente de novo.'; return; }
  const url = 'intent://login?t=' + encodeURIComponent(tk) + '#Intent;scheme=roteirocampo;package=br.roteiro.campo;end';
  m.innerHTML = '<p>Pronto! Agora volte ao aplicativo.</p><a class="b v" href="' + url + '">Voltar ao app</a>';
  try { location.href = url; } catch(e){}
}
auth.getRedirectResult().then(r => { if (r && r.credential) pronto(r); }).catch(e => { err.textContent = e.message || e.code; });
document.getElementById('g').onclick = async () => {
  err.textContent = '';
  try { pronto(await auth.signInWithPopup(prov)); }
  catch(e){ if (e && e.code === 'auth/popup-blocked'){ auth.signInWithRedirect(prov); } else if (e && e.code !== 'auth/popup-closed-by-user') err.textContent = e.message || e.code; }
};
</script></body></html>
